# The public read-only demo (guest mode, server/src/guest.ts) on one host: Postgres, a one-off migration, the web
# server and Caddy for HTTPS. No worker: the demo has nothing to read or analyze. Steps: docs/deploy.md.
#   docker compose -f compose.guest.yml up -d --build
# The model key is set to empty here, not read from .env, so a key can never reach this demo; the server also
# refuses to start in guest mode with one. Only Caddy publishes ports (80 and 443); Postgres and the web server
# are reachable only inside this compose network.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: veridict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: veridict
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridict -d veridict"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment: &env
      DATABASE_URL: postgres://veridict:${POSTGRES_PASSWORD}@db:5432/veridict
      ANTHROPIC_API_KEY: ""
      ALLOW_PAID_CALLS: "false"
      GUEST_MODE: "true"
      GUEST_EMAIL: ${GUEST_EMAIL:-guest@demo.example.test}
      APP_URL: https://${DEMO_DOMAIN:?Set DEMO_DOMAIN in .env, for example demo.yourdomain.com}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    restart: unless-stopped
    environment: *env
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  caddy_data:
